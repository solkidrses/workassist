<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Animations — WorkAssist Mockup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #09090b;
      --bg-card: #111214;
      --bg-user-message: #1c1d21;
      --bg-elevated: #15171b;
      --accent: #ff7c3b;
      --accent-transparent: rgba(255, 124, 59, 0.15);
      --accent-glow: rgba(255, 124, 59, 0.35);
      --danger: #ff7a59;
      --success: #5dd39e;
      --text-main: #fafafa;
      --text-muted: #a1a1aa;
      --border-radius: 14px;
      --border-subtle: #27272a;
      --shadow-soft: 0 10px 30px rgba(0, 0, 0, 0.22);
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .device {
      width: 100%;
      max-width: 390px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    /* ─── Header ─── */
    .header {
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-subtle);
      position: sticky;
      top: 0;
      background: rgba(9, 9, 11, 0.92);
      backdrop-filter: blur(18px);
      z-index: 10;
    }

    .header h1 {
      font-size: 20px;
      font-weight: 600;
    }

    /* ─── Search Bar ─── */
    .search-wrapper {
      position: relative;
      margin-bottom: 12px;
    }

    .search-input {
      width: 100%;
      background-color: var(--bg-user-message);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      border-radius: 12px;
      padding: 12px 12px 12px 40px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.3s var(--ease-out), box-shadow 0.3s var(--ease-out), background-color 0.3s var(--ease-out);
    }

    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(255, 124, 59, 0.12), 0 0 20px rgba(255, 124, 59, 0.08);
      background-color: #1f1f23;
    }

    .search-input.shake {
      animation: shake 0.4s ease;
      border-color: var(--danger);
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      stroke: var(--text-muted);
      fill: none;
      stroke-width: 2;
      transition: stroke 0.3s var(--ease-out), transform 0.3s var(--ease-spring);
    }

    .search-wrapper:focus-within .search-icon {
      stroke: var(--accent);
      transform: translateY(-50%) scale(1.15);
    }

    .search-clear {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%) scale(0);
      background: none;
      border: none;
      color: var(--accent);
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: transform 0.3s var(--ease-spring);
    }

    .search-clear.visible {
      transform: translateY(-50%) scale(1);
    }

    /* ─── Tag Filters ─── */
    .tag-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin-bottom: 20px;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .tag-row::-webkit-scrollbar { display: none; }

    .tag-chip {
      background-color: var(--bg-user-message);
      color: var(--text-muted);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.35s var(--ease-spring);
      position: relative;
      overflow: hidden;
    }

    .tag-chip:hover {
      border-color: rgba(255, 124, 59, 0.4);
      color: var(--text-main);
    }

    .tag-chip.active {
      background-color: var(--accent);
      color: #000;
      border-color: transparent;
      box-shadow: 0 4px 14px var(--accent-glow);
      transform: scale(1.05);
    }

    .tag-chip.active::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,0.25) 50%, transparent 70%);
      animation: shimmer-tag 1.2s ease-out;
    }

    @keyframes shimmer-tag {
      from { transform: translateX(-100%); }
      to { transform: translateX(100%); }
    }

    /* ─── Card List ─── */
    .card-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .zinc-card {
      background-color: var(--bg-card);
      border-radius: var(--border-radius);
      border-left: 3px solid var(--accent);
      padding: 16px;
      box-shadow: var(--shadow-soft);
      text-decoration: none;
      color: inherit;
      display: block;
      cursor: pointer;
      transition: transform 0.25s var(--ease-out), border-color 0.25s var(--ease-out), background-color 0.25s var(--ease-out), box-shadow 0.25s var(--ease-out);
      /* Stagger animation */
      opacity: 0;
      animation: card-enter 0.5s var(--ease-out) forwards;
    }

    .zinc-card:nth-child(1) { animation-delay: 0.05s; }
    .zinc-card:nth-child(2) { animation-delay: 0.10s; }
    .zinc-card:nth-child(3) { animation-delay: 0.15s; }
    .zinc-card:nth-child(4) { animation-delay: 0.20s; }
    .zinc-card:nth-child(5) { animation-delay: 0.25s; }
    .zinc-card:nth-child(6) { animation-delay: 0.30s; }
    .zinc-card:nth-child(7) { animation-delay: 0.35s; }
    .zinc-card:nth-child(8) { animation-delay: 0.40s; }

    @keyframes card-enter {
      from {
        opacity: 0;
        transform: translateY(16px) scale(0.97);
        filter: blur(4px);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
      }
    }

    .zinc-card:hover {
      transform: translateY(-2px);
      border-left-width: 5px;
      background-color: #16171a;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(255, 124, 59, 0.1);
    }

    .zinc-card:active {
      transform: scale(0.98);
    }

    /* Card exit animation */
    .zinc-card.exiting {
      animation: card-exit 0.3s var(--ease-out) forwards;
    }

    @keyframes card-exit {
      to {
        opacity: 0;
        transform: translateY(-12px) scale(0.95);
        filter: blur(3px);
      }
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }

    .card-title {
      font-size: 16px;
      font-weight: 600;
    }

    .zinc-tag {
      display: inline-block;
      background-color: var(--accent-transparent);
      color: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 9999px;
      padding: 2px 10px;
      font-size: 12px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .card-summary {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .card-match {
      margin-top: 8px;
      font-size: 12px;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .match-bar {
      width: 60px;
      height: 4px;
      background: var(--border-subtle);
      border-radius: 2px;
      overflow: hidden;
    }

    .match-bar-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      animation: fill-bar 0.8s var(--ease-out) 0.3s both;
      transform-origin: left;
    }

    @keyframes fill-bar {
      from { transform: scaleX(0); }
      to { transform: scaleX(1); }
    }

    /* ─── Skeleton Loading ─── */
    .skeleton-card {
      background-color: var(--bg-card);
      border-radius: var(--border-radius);
      border-left: 3px solid var(--border-subtle);
      padding: 16px;
      box-shadow: var(--shadow-soft);
    }

    .skeleton-line {
      height: 14px;
      border-radius: 6px;
      background: linear-gradient(90deg, #1a1a1e 0%, #2a2a30 50%, #1a1a1e 100%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite linear;
      margin-bottom: 10px;
    }

    .skeleton-line:last-child { margin-bottom: 0; }
    .skeleton-line.short { width: 50%; }
    .skeleton-line.medium { width: 75%; }
    .skeleton-line.tag { width: 50px; height: 20px; border-radius: 999px; }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .skeleton-card {
      opacity: 0;
      animation: skeleton-fade-in 0.3s ease forwards;
    }
    .skeleton-card:nth-child(1) { animation-delay: 0s; }
    .skeleton-card:nth-child(2) { animation-delay: 0.08s; }
    .skeleton-card:nth-child(3) { animation-delay: 0.16s; }

    @keyframes skeleton-fade-in {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ─── Empty State ─── */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      opacity: 0;
      animation: fade-in 0.4s ease 0.1s forwards;
    }

    .empty-state-icon {
      width: 48px;
      height: 48px;
      stroke: var(--text-muted);
      fill: none;
      stroke-width: 1.5;
      margin: 0 auto 16px;
      opacity: 0.4;
    }

    .empty-state-text {
      font-size: 15px;
      line-height: 1.5;
    }

    @keyframes fade-in {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ─── Results Count Badge ─── */
    .results-count {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 12px;
      opacity: 0;
      animation: fade-in 0.3s ease 0.15s forwards;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .results-count .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--success);
      animation: pulse-dot 2s infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* ─── Page Content ─── */
    .page-content {
      flex: 1;
      padding: 16px;
    }

    /* ─── Bottom Nav ─── */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 390px;
      height: 60px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      background: rgba(9, 9, 11, 0.94);
      backdrop-filter: blur(18px);
      border-top: 1px solid var(--border-subtle);
      z-index: 10;
    }

    .bottom-nav-link {
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      transition: color 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .bottom-nav-link.active {
      color: var(--accent);
    }

    .bottom-nav-link span {
      font-size: 10px;
      margin-top: 4px;
    }

    .bottom-nav-link svg {
      width: 24px;
      height: 24px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    /* ─── FAB ─── */
    .fab {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(170px);
      width: 56px;
      height: 56px;
      border-radius: 28px;
      background-color: var(--accent);
      color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(255, 124, 59, 0.4);
      z-index: 20;
      cursor: pointer;
      transition: transform 0.3s var(--ease-spring);
    }

    .fab:hover {
      transform: translateX(170px) scale(1.1) rotate(90deg);
    }

    .fab svg {
      width: 24px;
      height: 24px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.5;
    }

    /* ─── Demo Controls ─── */
    .demo-bar {
      position: fixed;
      top: 10px;
      right: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 100;
    }

    .demo-btn {
      background: rgba(255, 124, 59, 0.12);
      border: 1px solid rgba(255, 124, 59, 0.3);
      color: var(--accent);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .demo-btn:hover {
      background: rgba(255, 124, 59, 0.2);
      border-color: var(--accent);
    }

    .demo-hint {
      position: fixed;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 124, 59, 0.1);
      border: 1px solid rgba(255, 124, 59, 0.2);
      color: var(--accent);
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 12px;
      z-index: 50;
      pointer-events: none;
      opacity: 0;
      animation: hint-pulse 4s ease 1s;
    }

    @keyframes hint-pulse {
      0%, 100% { opacity: 0; }
      15%, 85% { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>

<!-- Demo Controls -->
<div class="demo-bar">
  <button class="demo-btn" onclick="simulateSearch()">Поиск</button>
  <button class="demo-btn" onclick="simulateLoading()">Загрузка</button>
  <button class="demo-btn" onclick="simulateEmpty()">Пусто</button>
  <button class="demo-btn" onclick="resetAll()">Сброс</button>
</div>

<div class="demo-hint">Нажми кнопки сверху →</div>

<div class="device">
  <!-- Header -->
  <div class="header">
    <h1>База</h1>
  </div>

  <!-- Page Content -->
  <div class="page-content">
    <!-- Search -->
    <div class="search-wrapper">
      <svg class="search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" class="search-input" placeholder="Поиск по базе..." id="searchInput" oninput="onSearchInput(this)" onkeydown="onSearchKey(event)">
      <button class="search-clear" id="searchClear" onclick="clearSearch()">Сброс</button>
    </div>

    <!-- Tags -->
    <div class="tag-row" id="tagRow">
      <button class="tag-chip active" onclick="selectTag(this, 'all')">Все</button>
      <button class="tag-chip" onclick="selectTag(this, 'vpn')">VPN</button>
      <button class="tag-chip" onclick="selectTag(this, 'tma')">TMA</button>
      <button class="tag-chip" onclick="selectTag(this, 'cs2')">CS2</button>
      <button class="tag-chip" onclick="selectTag(this, 'clario')">Clario</button>
      <button class="tag-chip" onclick="selectTag(this, 'general')">General</button>
    </div>

    <!-- Results -->
    <div id="resultsCount" class="results-count" style="display:none">
      <span class="dot"></span>
      <span id="resultsText">Найдено 5 инструкций</span>
    </div>

    <div class="card-list" id="cardList">
      <!-- Cards injected by JS -->
    </div>
  </div>

  <!-- FAB -->
  <div class="fab">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
  </div>

  <!-- Bottom Nav -->
  <div class="bottom-nav">
    <a class="bottom-nav-link active">
      <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      <span style="font-weight:500">База</span>
    </a>
    <a class="bottom-nav-link">
      <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <span>Чат</span>
    </a>
  </div>
</div>

<script>
  const SAMPLE_DATA = [
    { id: 1, title: 'Настройка WireGuard VPN', tag: 'vpn', summary: 'Пошаговая инструкция по установке и настройке WireGuard на Ubuntu 22.04 сервере.', match: 92 },
    { id: 2, title: 'Создание Telegram Mini App', tag: 'tma', summary: 'Руководство по созданию TMA с Next.js: инициализация, initData, авторизация.', match: 87 },
    { id: 3, title: 'CS2 Server Config', tag: 'cs2', summary: 'Конфигурация выделенного сервера CS2: tickrate 128, плагины, RCON пароль.', match: 81 },
    { id: 4, title: 'Clario VPN Deployment', tag: 'clario', summary: 'Деплой Clario VPN через Docker Compose с автоматическим обновлением сертификатов.', match: 76 },
    { id: 5, title: 'Общие правила безопасности', tag: 'general', summary: 'Базовые принципы работы с паролями, 2FA и управлением доступом.', match: 68 },
    { id: 6, title: 'OpenVPN vs WireGuard', tag: 'vpn', summary: 'Сравнение производительности, безопасности и простоты настройки.', match: 64 },
    { id: 7, title: 'TMA Analytics Integration', tag: 'tma', summary: 'Подключение аналитики к Telegram Mini App: GTM, Pixel, события.', match: 55 },
  ];

  const cardList = document.getElementById('cardList');
  const searchInput = document.getElementById('searchInput');
  const searchClear = document.getElementById('searchClear');
  const resultsCount = document.getElementById('resultsCount');
  const resultsText = document.getElementById('resultsText');

  function renderCards(data) {
    // Exit animation for old cards
    const oldCards = cardList.querySelectorAll('.zinc-card, .skeleton-card, .empty-state');
    oldCards.forEach(c => c.classList.add('exiting'));

    setTimeout(() => {
      cardList.innerHTML = '';

      if (data.length === 0) {
        cardList.innerHTML = `
          <div class="empty-state">
            <svg class="empty-state-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <div class="empty-state-text">Ничего не найдено<br>Попробуйте изменить запрос</div>
          </div>
        `;
        resultsCount.style.display = 'none';
        return;
      }

      data.forEach((item, i) => {
        const card = document.createElement('div');
        card.className = 'zinc-card';
        card.style.animationDelay = `${0.05 + i * 0.06}s`;
        card.innerHTML = `
          <div class="card-header">
            <span class="card-title">${item.title}</span>
            <span class="zinc-tag">${item.tag}</span>
          </div>
          <p class="card-summary">${item.summary}</p>
          ${item.match ? `
            <div class="card-match">
              <span>Совпадение: ${item.match}%</span>
              <div class="match-bar"><div class="match-bar-fill" style="width:${item.match}%"></div></div>
            </div>
          ` : ''}
        `;
        cardList.appendChild(card);
      });

      resultsText.textContent = `Найдено ${data.length} ${data.length === 1 ? 'инструкция' : data.length < 5 ? 'инструкции' : 'инструкций'}`;
      resultsCount.style.display = 'flex';
      resultsCount.style.animation = 'none';
      resultsCount.offsetHeight; // reflow
      resultsCount.style.animation = 'fade-in 0.3s ease 0.1s forwards';
    }, oldCards.length > 0 ? 280 : 0);
  }

  function renderSkeletons(count = 3) {
    cardList.innerHTML = '';
    for (let i = 0; i < count; i++) {
      const sk = document.createElement('div');
      sk.className = 'skeleton-card';
      sk.style.animationDelay = `${i * 0.08}s`;
      sk.innerHTML = `
        <div style="display:flex; justify-content:space-between; margin-bottom:10px">
          <div class="skeleton-line medium"></div>
          <div class="skeleton-line tag"></div>
        </div>
        <div class="skeleton-line"></div>
        <div class="skeleton-line short"></div>
      `;
      cardList.appendChild(sk);
    }
    resultsCount.style.display = 'none';
  }

  function onSearchInput(input) {
    const val = input.value.trim();
    searchClear.classList.toggle('visible', val.length > 0);

    if (val.length === 0) {
      renderCards(SAMPLE_DATA);
      return;
    }

    // Debounce + filter
    clearTimeout(window._searchTimer);
    window._searchTimer = setTimeout(() => {
      const filtered = SAMPLE_DATA.filter(item =>
        item.title.toLowerCase().includes(val.toLowerCase()) ||
        item.summary.toLowerCase().includes(val.toLowerCase()) ||
        item.tag.toLowerCase().includes(val.toLowerCase())
      );
      filtered.forEach(f => f.match = Math.floor(50 + Math.random() * 45));
      filtered.sort((a, b) => b.match - a.match);
      renderCards(filtered);
    }, 300);
  }

  function onSearchKey(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      const val = searchInput.value.trim();
      if (val.length > 0 && val.length < 3) {
        searchInput.classList.add('shake');
        setTimeout(() => searchInput.classList.remove('shake'), 400);
        return;
      }
      onSearchInput(searchInput);
    }
  }

  function clearSearch() {
    searchInput.value = '';
    searchClear.classList.remove('visible');
    renderCards(SAMPLE_DATA);
  }

  function selectTag(el, tag) {
    document.querySelectorAll('.tag-chip').forEach(c => c.classList.remove('active'));
    el.classList.add('active');

    if (tag === 'all') {
      renderCards(SAMPLE_DATA);
    } else {
      const filtered = SAMPLE_DATA.filter(item => item.tag === tag);
      filtered.forEach(f => f.match = undefined);
      renderCards(filtered);
    }
  }

  // Demo helpers
  function simulateSearch() {
    searchInput.value = 'vpn';
    searchClear.classList.add('visible');
    renderSkeletons(2);
    setTimeout(() => {
      const filtered = SAMPLE_DATA.filter(i => i.tag === 'vpn' || i.title.toLowerCase().includes('vpn'));
      filtered.forEach(f => f.match = Math.floor(70 + Math.random() * 25));
      filtered.sort((a, b) => b.match - a.match);
      renderCards(filtered);
    }, 900);
  }

  function simulateLoading() {
    renderSkeletons(4);
  }

  function simulateEmpty() {
    searchInput.value = 'xyzqwerty';
    searchClear.classList.add('visible');
    renderCards([]);
  }

  function resetAll() {
    searchInput.value = '';
    searchClear.classList.remove('visible');
    document.querySelectorAll('.tag-chip').forEach(c => c.classList.remove('active'));
    document.querySelector('.tag-chip').classList.add('active');
    renderCards(SAMPLE_DATA);
  }

  // Initial render
  renderCards(SAMPLE_DATA);
</script>

</body>
</html>
